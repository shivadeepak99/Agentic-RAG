services:
  agentic-rag:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agentic-rag
    ports:
      - "${PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}
      USE_REAL_LLM: ${USE_REAL_LLM:-true}
      EMBED_MODEL: ${EMBED_MODEL:-sentence-transformers/all-MiniLM-L6-v2}
      CHROMA_PERSIST_DIR: ${CHROMA_PERSIST_DIR:-data/chroma}
      CHROMA_COLLECTION: ${CHROMA_COLLECTION:-papers}
      RETRIEVAL_MODE: ${RETRIEVAL_MODE:-lightweight_hybrid}
      RETRIEVAL_USE_RERANKER: ${RETRIEVAL_USE_RERANKER:-false}
      RETRIEVAL_HYBRID_VECTOR_K: ${RETRIEVAL_HYBRID_VECTOR_K:-12}
      RETRIEVAL_HYBRID_BM25_K: ${RETRIEVAL_HYBRID_BM25_K:-12}
      RETRIEVAL_HYBRID_FUSED_K: ${RETRIEVAL_HYBRID_FUSED_K:-16}
      RETRIEVAL_RERANKER_TOP_K: ${RETRIEVAL_RERANKER_TOP_K:-6}
      RETRIEVAL_RERANKER_MODEL: ${RETRIEVAL_RERANKER_MODEL:-cross-encoder/ms-marco-MiniLM-L-6-v2}
      BOOTSTRAP_INGEST: ${BOOTSTRAP_INGEST:-true}
      INGEST_QUERY: ${INGEST_QUERY:-cat:cs.AI}
      INGEST_MAX_RESULTS: ${INGEST_MAX_RESULTS:-100}
      RESET_CHROMA: ${RESET_CHROMA:-false}
      HOST: 0.0.0.0
      PORT: 8000
    volumes:
      - ./data:/app/data
    restart: unless-stopped
